name: List Railway Volumes

on:
  workflow_dispatch:

jobs:
  list-volumes:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: List Railway volumes
        run: |
          INFO=$(curl -sS \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')

          PROJECT_ID=$(echo "$INFO" | jq -r '.data.projectToken.projectId')

          curl -sS \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"query\":\"query project(\$id: String!) { project(id: \$id) { volumes { edges { node { id name createdAt } } } } }\",\"variables\":{\"id\":\"$PROJECT_ID\"}}"
