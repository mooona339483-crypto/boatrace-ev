name: Python Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          python -m py_compile \
            collector.py \
            market_collector.py \
            parser.py \
            odds_mapper.py \
            run_pipeline.py \
            ev_engine.py \
            racer_data_parser.py \
            probability_model.py \
            bet_manager.py \
            prediction_recorder.py \
            backtest_engine.py \
            ai_integration.py

      - name: Run unit tests
        run: |
          python -m unittest discover -v -p "test_*.py"
