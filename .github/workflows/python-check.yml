
name: Python Syntax Check

on:
  pull_request:
  push:
    branches:
      - mooona339483-crypto-patch-1

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path(".").glob("*.py"))
          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path)
              )
              print("SYNTAX_OK", path)

          print("ALL_SYNTAX_CHECKS_PASSED")
          PY
      - name: Test pipeline execution
        run: python -m unittest test_pipeline.py -v

